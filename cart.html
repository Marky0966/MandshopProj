$("#pf").onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));st("users",users().map(x=>x.email==u.email?{...x,...f}:x));toast("Profile saved");$("#ph h1").textContent=f.name};
const draw=()=>{const l=ls("orders",[]).filter(o=>o.email==u.email);$("#orders").innerHTML=l.length?l.map(ord).join(""):`<p>No orders yet. <a href="shop.html" class="ok">Start shopping</a></p>`};
$("#orders").onclick=e=>{const b=e.target.closest("[data-cancel]");if(!b)return;st("orders",ls("orders",[]).map(o=>o.id==b.dataset.cancel?{...o,status:"Cancelled"}:o));toast("Order cancelled");draw()};draw()},
settings(){if(guard)return;const u=me(),s=S(),sv=(k,v)=>{st("settings",{...S(),[k]:v});toast("Settings saved")};
$("#th").value=s.theme;$("#cu").value=s.currency;$("#n1").checked=s.n1;$("#n2").checked=s.n2;
$("#th").onchange=e=>{document.documentElement.dataset.theme=e.target.value;sv("theme",e.target.value)};$("#cu").onchange=e=>sv("currency",e.target.value);
$("#n1").onchange=e=>sv("n1",e.target.checked);$("#n2").onchange=e=>sv("n2",e.target.checked);
$("#pwf").onsubmit=e=>{e.preventDefault();if(u.prov!="email")return toast("Your account uses "+u.prov+" sign-in. No password to change.");
if(hp($("#p1").value)!==u.pw)return toast("Current password is incorrect");if($("#p2").value.length<6)return toast("New password needs 6+ characters");
st("users",users().map(x=>x.email==u.email?{...x,pw:hp($("#p2").value)}:x));e.target.reset();toast("Password updated")};
$("#out2").onclick=()=>{st("me","");go("index.html")};
$("#del").onclick=async()=>{if(await modal("Delete your account?",null,"This permanently removes your account and orders.")){st("users",users().filter(x=>x.email!=u.email));st("orders",ls("orders",[]).filter(o=>o.email!=u.email));st("me","");go("index.html")}}}};
if(!guard)pg[page]?.();
</script><script>addEventListener("load",()=>{if(getComputedStyle(document.body).display!="flex")document.body.insertAdjacentHTML("afterbegin",'<div style="background:#c92a2a;color:#fff;padding:14px;font:700 16px sans-serif;text-align:center">Design files not found. Keep style.css, main.js and logo.svg in the SAME folder as this page, or use the standalone version.</div>')})</script></body></html>
